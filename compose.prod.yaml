services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: 'laravel_app'
    restart: always
    environment:
      APP_ENV: production
      APP_KEY: '${APP_KEY}'
      DB_HOST: mysql
      DB_DATABASE: '${DB_DATABASE}'
      DB_USERNAME: '${DB_USERNAME}'
      DB_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - app_data:/var/www/html
      - uploads_data:/var/www/html/storage/app/public
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
    volumes:
      - app_data:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - uploads_data:/var/www/html/storage/app/public
    networks:
      - app_network
    depends_on:
      - app

  mysql:
    image: 'mysql:8.4'
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      timeout: 5s
      retries: 3

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - '8080:80'
    environment:
      PMA_HOST: mysql
      PMA_USER: '${DB_USERNAME}'
      PMA_PASSWORD: '${DB_PASSWORD}'
      PMA_PORT: 3306
    networks:
      - app_network
    depends_on:
      - mysql

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
  app_data:
    driver: local
