name: Deploy to AWS EC2 instance

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/myapp/my-new-portfolio

            git pull origin main

            # Write .env from secret
            echo "${{ secrets.PROD_ENV_FILE }}" > .env

            # Fix values with spaces
            sed -i 's/^APP_NAME=.*/APP_NAME="Portfolio Backend"/' .env
            sed -i 's/^APP_BACKEND_NAME=.*/APP_BACKEND_NAME="Portfolio Backend"/' .env
            sed -i 's/^APP_DEVELOPER_NAME=.*/APP_DEVELOPER_NAME="Brian Ssekalegga"/' .env
            sed -i 's/^PORTFOLIO_OWNER_NAME=.*/PORTFOLIO_OWNER_NAME="Brian Ssekalegga"/' .env
            sed -i 's/^PORTFOLIO_OWNER_NAME_INITIALS=.*/PORTFOLIO_OWNER_NAME_INITIALS="BS"/' .env
            sed -i 's/^PORTFOLIO_OWNER_TITLE=.*/PORTFOLIO_OWNER_TITLE="Full Stack Developer"/' .env

            # Get the actual docker volume prefix (folder name may vary)
            COMPOSE_PROJECT=$(docker compose -f compose.prod.yaml ls --format json 2>/dev/null | grep -o '"my-new-portfolio"' | head -1 || echo "my-new-portfolio")

            # Stop containers and remove ONLY app_data volume (keep uploads + mysql)
            docker compose -f compose.prod.yaml down
            docker volume rm my-new-portfolio_app_data 2>/dev/null || true

            # Rebuild fresh
            docker compose -f compose.prod.yaml build --no-cache
            docker compose -f compose.prod.yaml up -d

            # Wait for containers to be ready
            sleep 10

            # Run migrations
            docker compose -f compose.prod.yaml exec -T app php artisan migrate --force

            # Only seed if tables are empty
            docker compose -f compose.prod.yaml exec -T app php artisan db:seed --force --class=DatabaseSeeder 2>/dev/null || true

            # Storage and cache
            docker compose -f compose.prod.yaml exec -T app php artisan storage:link --force
            docker compose -f compose.prod.yaml exec -T app php artisan config:cache
            docker compose -f compose.prod.yaml exec -T app php artisan route:cache
            docker compose -f compose.prod.yaml exec -T app php artisan view:cache

            echo "✅ Deploy complete!"
